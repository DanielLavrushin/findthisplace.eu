name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 3.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.3"
          cache-dependency-path: site/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Build frontend
        run: |
          cd site/http/ui
          pnpm install
          pnpm build

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 3.1.2)"
            exit 1
          fi

      - name: Create build directory
        run: mkdir -p build

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          VERSION_COMMIT: ${{ github.sha }}
          VERSION_DATE: ${{ github.event.repository.updated_at }}
          CGO_ENABLED: 0
        run: |
          cd site
          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${VERSION_COMMIT} -X main.Date=${VERSION_DATE}" \
            -o ../build/findthisplace .

      - name: Generate MD5 checksum
        run: |
          cd build
          md5sum findthisplace > findthisplace.md5

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: |
          # Stays a draft until both assets are in, so "latest" never points at a release without them
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Release $TAG" --generate-notes
          # GitHub can answer an upload with a 5xx after storing the asset; --clobber lets the retry replace it
          for file in build/findthisplace build/findthisplace.md5; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$TAG" "$file" --clobber && break
              if [ "$attempt" = 5 ]; then
                gh release delete "$TAG" --yes
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done
          gh release edit "$TAG" --draft=false --latest

      - name: Trigger deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"action":"released","version":"${{ inputs.version }}"}'
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
          HTTP_CODE=$(curl -s --retry 3 -o /tmp/response.txt -w "%{http_code}" -X POST https://findthisplace.eu/api/webhook/update \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD")
          echo "HTTP $HTTP_CODE: $(cat /tmp/response.txt)"
          [ "$HTTP_CODE" = "200" ] || exit 1

      - name: Wait for the site to run the new build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          EXPECTED="$VERSION.${GITHUB_SHA::7}"
          for _ in $(seq 30); do
            LIVE=$(curl -s --max-time 10 https://findthisplace.eu/api/version | jq -r .version) || true
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "findthisplace.eu is running $LIVE"
              exit 0
            fi
            sleep 10
          done
          echo "::error::findthisplace.eu still reports '$LIVE' instead of '$EXPECTED'; check journalctl -u findthisplace-update.service on the Pi"
          exit 1
